<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Odin-Calculator</title>
        <script type="module" src="script.js"></script>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <h1>Odin-Calculator</h1>
        <div class="calculator">
            <div class="result">
                <small>
                    <span id="firstArgument"></span>
                    <span id="operator"></span>
                </small>
                <output></output>
            </div>
            <div class="keyboard">
                <div class="row">
                    <button data-type="number">7</button>
                    <button data-type="number">8</button>
                    <button data-type="number">9</button>
                    <button data-type="operator">+</button>
                </div>
                <div class="row">
                    <button data-type="number">4</button>
                    <button data-type="number">5</button>
                    <button data-type="number">6</button>
                    <button data-type="operator">−</button>
                </div>
                <div class="row">
                    <button data-type="number">1</button>
                    <button data-type="number">2</button>
                    <button data-type="number">3</button>
                    <button data-type="operator">×</button>
                </div>
                <div class="row">
                    <button data-type="backspace">←</button>
                    <button data-type="number">0</button>
                    <button data-type="decimal">.</button>
                    <button data-type="operator">÷</button>
                </div>
                <div class="row">
                    <button data-type="clear" class="clear-btn">C</button>
                    <button data-type="operator" class="result-btn">=</button>
                </div>
            </div>
        </div>
    </body>
</html>
